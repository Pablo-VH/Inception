worker_processes auto;
 
events {
    worker_connections 1024;
}
 
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
 
    server {
        # Unico punto de entrada del stack: puerto 443, solo TLS
        listen 443 ssl;
        server_name pavicent.42.fr;
 
        # Restringimos a TLSv1.2 y TLSv1.3 unicamente (nada de v1.0/v1.1)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate     /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;
 
        # Los archivos de WordPress viven en el volumen compartido
        # con el contenedor de wordpress (mismo path en ambos)
        root /var/www/html;
        index index.php index.html;
 
        location / {
            try_files $uri $uri/ /index.php?$args;
        }
 
        # Cualquier peticion .php se delega a php-fpm, que escucha
        # en el puerto 9000 del contenedor "wordpress"
        location ~ \.php$ {
            fastcgi_pass wordpress:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }
}
 