
[www]
user = nobody
group = nobody
 
; Escuchamos en el puerto 9000 de todas las interfaces, para que
; NGINX (en otro contenedor) pueda conectarse via la red docker
listen = 0.0.0.0:9000
 
listen.owner = nobody
listen.group = nobody
listen.mode = 0660
 
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
 
clear_env = no
 